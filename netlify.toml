[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Keep the public app on one URL while forwarding API calls to the
# separately deployed Spring Boot service.
[[redirects]]
  from = "/api/*"
  to = "https://capstone-dairy-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
